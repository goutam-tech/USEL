name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

env:
  PACKAGE_NAME: usel
  OWNER: goutam-tech
  TAP_NAME: USEL

jobs:
  details:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.release.outputs.new_version }}
      suffix: ${{ steps.release.outputs.suffix }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - id: release
        run: |
          VERSION=$(python - <<'PY'
          import tomllib
          with open("pyproject.toml","rb") as f:
              print(tomllib.load(f)["project"]["version"])
          PY
          )

          echo "Version: $VERSION"

          echo "new_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "suffix=" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag '$VERSION' already exists."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

  check_pypi:
    needs: details
    runs-on: ubuntu-latest
    steps:
      - run: |
          response=$(curl -s https://pypi.org/pypi/${PACKAGE_NAME}/json || true)
          latest=$(echo "$response" | jq -r 'if type=="object" and has("releases") then (.releases|keys_unsorted|last // "0.0.0") else "0.0.0" end')
          echo "Latest=$latest"
          if [ "$latest" = "${{ needs.details.outputs.new_version }}" ]; then
            echo "Already released."
            exit 1
          fi

  setup_and_build:
    needs: [details,check_pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          poetry version ${{ needs.details.outputs.new_version }}
          poetry install --sync --no-interaction
          poetry build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi_publish:
    needs: [setup_and_build,details]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github_release:
    needs: [setup_and_build,details]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.details.outputs.tag_name }}" dist/* --title "${{ needs.details.outputs.tag_name }}" --generate-notes

  bump_homebrew_formula:
    needs: [details,github_release,pypi_publish]
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.BREW_TAP_TOKEN }}
          repository: ${{ env.OWNER }}/${{ env.TAP_NAME }}
          event-type: update-formula
          client-payload: >-
            {
              "formula_version":"${{ needs.details.outputs.new_version }}",
              "formula_name":"${{ env.PACKAGE_NAME }}",
              "formula_url":"https://github.com/${{ env.OWNER }}/${{ env.PACKAGE_NAME }}/releases/download/${{ needs.details.outputs.tag_name }}/${{ env.PACKAGE_NAME }}-${{ needs.details.outputs.new_version }}.tar.gz"
            }