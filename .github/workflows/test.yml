name: USEL CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} • ${{ matrix.os }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev

      - name: Check formatting (Ruff)
        run: uv run ruff format --check .

      - name: Run Ruff
        run: uv run ruff check .

      - name: Compile Python files
        run: uv run python -m compileall src tests example

      - name: Smoke-test runnable maths examples
        run: |
          uv run python example/maths/example_numerical_integration.py
          uv run python example/maths/example_ode_solver.py
          uv run python example/maths/example_matrix_multiplication.py
      - name: Run tests
        run: uv run pytest -v

      - name: Build package
        run: uv build
