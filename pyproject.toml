[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "usel"
version = "1.0.6"
description = "An open-source, CPU-only scientific computing framework focused on quantum physics simulations and numerical methods."

authors = [
    { name = "Goutam Parashuram Gotur", email= "goutamgotur2006@outlook.com" },
    { name = "K R Raaghavindhra", email="raaghavindhra@gmail.com" }
]

license = { text = "MIT" }
readme = "README.md"

keywords = [
    "scientific-computing",
    "numerical-methods",
    "physics",
    "linear-algebra",
    "computational-physics",
    "dirac-equation",
    "mathematics",
    "open-source",
    "quantum-mechanics",
    "schrondingers",
    "maxwell"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Chemistry"
]

requires-python = ">=3.11"

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "sympy>=1.12",
    "pyyaml>=6.0",
    "toml>=0.10.2",
    "matplotlib>=3.8"
]

[project.urls]
Homepage = "https://github.com/goutam-tech/usel"
Repository = "https://github.com/goutam-tech/usel"
Documentation = "https://goutam-tech.github.io/usel"

[project.scripts]
usel = "usel.cli.main:main"

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "black>=24.3.0",
    "mypy>=1.9.0",
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=usel --cov-report=term-missing"